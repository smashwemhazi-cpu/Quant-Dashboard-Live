name: tests
# The server's auto-updater (deploy/vertex1-update) only installs a commit on main once this passes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt
      - run: pip install -r requirements-server.txt pytest
      - run: python -m pytest -q
