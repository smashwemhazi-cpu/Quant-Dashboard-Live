# /etc/nginx/sites-available/vertex1  - replace the two server_name values, then:
#   ln -s /etc/nginx/sites-available/vertex1 /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#   certbot --nginx -d api.example.com -d console.example.com     (free TLS)

server {   # DONNA API: TradingView + Telegram webhooks must reach this over HTTPS
    listen 80;
    server_name api.example.com;
    client_max_body_size 256k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {   # Streamlit console (needs websockets)
    listen 80;
    server_name console.example.com;
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
